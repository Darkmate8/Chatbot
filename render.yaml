# Render Blueprint: Render reads this file to create the web service.
# Secrets are not stored here; Render asks for them once, on first setup.
services:
  - type: web
    name: cafe-chat
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT --no-access-log
    healthCheckPath: /
    envVars:
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        sync: false
